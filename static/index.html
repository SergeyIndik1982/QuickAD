<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafe Caption</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 24px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            color: #111;
        }

        h1 {
            font-size: 22px;
            font-weight: 500;
            margin-bottom: 28px;
        }

        select {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            border: 1px solid #e5e5e5;
            border-radius: 10px;
            background: white;
            appearance: none;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 16px;
            font-size: 16px;
            border-radius: 10px;
            border: none;
            background: black;
            color: white;
            cursor: pointer;
            transition: opacity 0.2s ease;
        }

        button:active {
            opacity: 0.8;
        }

        button.secondary {
            background: #f2f2f2;
            color: black;
        }

        #loader {
            margin-top: 20px;
            font-size: 14px;
            opacity: 0.6;
            display: none;
        }

        #result {
            margin-top: 40px;
            font-size: 16px;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .actions {
            margin-top: 24px;
            display: none;
            gap: 12px;
            flex-direction: column;
        }

        footer {
            margin-top: auto;
            padding-top: 40px;
            font-size: 12px;
            opacity: 0.4;
            text-align: center;
        }
    </style>
</head>

<body>

    <h1>Cafe Caption</h1>

    <select id="situation">
        <option value="Morning opening">Morning opening</option>
        <option value="Slow afternoon">Slow afternoon</option>
        <option value="Busy weekend">Busy weekend</option>
        <option value="Rainy day">Rainy day</option>
        <option value="Just a normal day">Just a normal day</option>
    </select>

    <button onclick="generate()">Generate</button>

    <div id="loader">Generating…</div>

    <div id="result"></div>

    <div class="actions" id="actions">
        <button class="secondary" onclick="copyText()">Copy</button>
        <button onclick="generate()">Regenerate</button>
    </div>

    <footer>
        Minimal. Human. Real.
    </footer>

<script>
async function generate() {
    const situation = document.getElementById("situation").value;

    const loader = document.getElementById("loader");
    const result = document.getElementById("result");
    const actions = document.getElementById("actions");

    loader.style.display = "block";
    result.innerText = "";
    actions.style.display = "none";

    try {
        const response = await fetch("/generate", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ situation })
        });

        const data = await response.json();

        loader.style.display = "none";
        result.innerText = data.text;
        actions.style.display = "flex";

    } catch (error) {
        loader.style.display = "none";
        result.innerText = "Connection error.";
    }
}

function copyText() {
    const text = document.getElementById("result").innerText;
    navigator.clipboard.writeText(text);
}
</script>

</body>
</html>
