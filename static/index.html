<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cafe Caption</title>

<style>
    :root {
        --primary: #000;
        --secondary: #f2f2f2;
        --radius: 16px;
        --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    body {
        margin: 0;
        padding: 24px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #fff;
        color: #1a1a1a;
        -webkit-tap-highlight-color: transparent;
    }

    h1 { font-size: 24px; font-weight: 700; margin-bottom: 24px; letter-spacing: -0.5px; }

    label { display: block; margin-bottom: 8px; font-size: 14px; color: #666; font-weight: 500; }

    select {
        width: 100%;
        padding: 16px;
        font-size: 16px;
        border: 1.5px solid #eee;
        border-radius: var(--radius);
        background: #f9f9f9;
        appearance: none;
        outline: none;
        transition: border-color var(--transition);
    }

    select:focus { border-color: var(--primary); }

    button {
        width: 100%;
        padding: 16px;
        margin-top: 16px;
        font-size: 16px;
        font-weight: 600;
        border-radius: var(--radius);
        border: none;
        background: var(--primary);
        color: white;
        cursor: pointer;
        transition: opacity 0.2s;
    }

    button:active { opacity: 0.8; transform: scale(0.98); }
    button:disabled { background: #ccc; cursor: not-allowed; }

    /* Bottom Sheet Styles */
    #overlay {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.4);
        backdrop-filter: blur(4px);
        opacity: 0;
        visibility: hidden;
        transition: all var(--transition);
        z-index: 99;
    }

    #overlay.active { opacity: 1; visibility: visible; }

    #sheet {
        position: fixed;
        left: 0;
        bottom: -100%;
        width: 100%;
        background: #fff;
        border-radius: 24px 24px 0 0;
        box-shadow: 0 -10px 40px rgba(0,0,0,0.1);
        padding: 24px;
        padding-bottom: env(safe-area-inset-bottom, 24px);
        transition: bottom var(--transition), transform 0.1s ease-out;
        z-index: 100;
        box-sizing: border-box;
    }

    #sheet.active { bottom: 0; }

    .drag-handle {
        width: 36px;
        height: 5px;
        background: #e0e0e0;
        border-radius: 10px;
        margin: -8px auto 20px auto;
    }

    #result {
        font-size: 17px;
        line-height: 1.6;
        color: #333;
        min-height: 60px;
    }

    .copy-btn {
        background: var(--secondary);
        color: var(--primary);
        margin-top: 24px;
    }
</style>
</head>

<body>

    <h1>☕️ Cafe Caption</h1>

    <label for="situation">Select a vibe</label>
    <select id="situation">
        <option value="Morning opening">☀️ Morning opening</option>
        <option value="Slow afternoon">📖 Slow afternoon</option>
        <option value="Busy weekend">⚡️ Busy weekend</option>
        <option value="Rainy day">☔️ Rainy day</option>
        <option value="Just a normal day">☕️ Just a normal day</option>
    </select>

    <button id="genBtn" onclick="generate()">Generate Caption</button>

    <div id="overlay" onclick="closeSheet()"></div>

    <div id="sheet">
        <div class="drag-handle"></div>
        <div id="result"></div>
        <button id="copyBtn" class="copy-btn" onclick="copyText()">Copy Caption</button>
    </div>

<script>
const sheet = document.getElementById("sheet");
const overlay = document.getElementById("overlay");
const genBtn = document.getElementById("genBtn");
const copyBtn = document.getElementById("copyBtn");
const resultDiv = document.getElementById("result");

let startY = 0;
let isDragging = false;

async function generate() {
    const situation = document.getElementById("situation").value;
    
    // UI Feedback: Loading
    genBtn.disabled = true;
    genBtn.innerText = "Generating...";

    try {
        const response = await fetch("/generate", {
            method: "POST",
            headers: {"Content-Type":"application/json"},
            body: JSON.stringify({ situation })
        });

        if (!response.ok) throw new Error("Server error");

        const data = await response.json();
        resultDiv.innerText = data.text;

        // Show Sheet
        overlay.classList.add("active");
        sheet.classList.add("active");
    } catch (err) {
        alert("Failed to generate. Please try again.");
    } finally {
        genBtn.disabled = false;
        genBtn.innerText = "Generate Caption";
    }
}

function closeSheet() {
    sheet.classList.remove("active");
    overlay.classList.remove("active");
    sheet.style.transform = "translateY(0)"; // Reset drag pos
}

async function copyText() {
    const text = resultDiv.innerText;
    try {
        await navigator.clipboard.writeText(text);
        
        // UI Feedback: Copied
        const originalText = copyBtn.innerText;
        copyBtn.innerText = "✅ Copied!";
        copyBtn.style.background = "#e8f5e9";
        
        setTimeout(() => {
            copyBtn.innerText = originalText;
            copyBtn.style.background = "";
        }, 2000);
    } catch (err) {
        console.error("Copy failed");
    }
}

/* Enhanced Swipe Down */
sheet.addEventListener("touchstart", e => {
    startY = e.touches[0].clientY;
    isDragging = true;
    sheet.style.transition = "none"; // Disable transitions while dragging
}, {passive: true});

sheet.addEventListener("touchmove", e => {
    if (!isDragging) return;
    const currentY = e.touches[0].clientY;
    const diff = currentY - startY;
    
    if (diff > 0) {
        sheet.style.transform = `translateY(${diff}px)`;
    }
}, {passive: true});

sheet.addEventListener("touchend", e => {
    isDragging = false;
    sheet.style.transition = "bottom 0.35s ease, transform 0.3s ease";
    
    const endY = e.changedTouches[0].clientY;
    const diff = endY - startY;

    if (diff > 120) {
        closeSheet();
    } else {
        sheet.style.transform = "translateY(0)";
    }
});
</script>

</body>
</html>
