<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cafe Caption</title>

<style>
body {
    margin:0;
    padding:24px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:#fff;
    display:flex;
    flex-direction:column;
    height:100vh;
    transition:filter 0.3s ease;
}

body.blur {
    filter: blur(4px);
}

h1 {
    font-size:22px;
    font-weight:500;
    margin-bottom:24px;
}

select {
    width:100%;
    padding:14px;
    font-size:16px;
    border:1px solid #ddd;
    border-radius:12px;
}

button {
    width:100%;
    padding:14px;
    margin-top:16px;
    font-size:16px;
    border-radius:12px;
    border:none;
    background:black;
    color:white;
    cursor:pointer;
}

#overlay {
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.2);
    backdrop-filter: blur(6px);
    opacity:0;
    pointer-events:none;
    transition:opacity 0.3s ease;
}

#overlay.active {
    opacity:1;
    pointer-events:auto;
}

#sheet {
    position:fixed;
    left:0;
    bottom:-100%;
    width:100%;
    background:#fff;
    border-radius:20px 20px 0 0;
    box-shadow:0 -5px 30px rgba(0,0,0,0.15);
    padding:24px;
    transition:bottom 0.35s ease;
    max-height:80%;
    overflow:auto;
    touch-action:none;
}

#sheet.active {
    bottom:0;
}

.drag-bar {
    width:40px;
    height:4px;
    background:#ccc;
    border-radius:2px;
    margin:0 auto 16px auto;
}

#result {
    white-space:pre-wrap;
    line-height:1.6;
}

.copy-btn {
    margin-top:20px;
    background:#f2f2f2;
    color:black;
}
</style>
</head>

<body>

<h1>Cafe Caption</h1>

<select id="situation">
    <option value="Morning opening">Morning opening</option>
    <option value="Slow afternoon">Slow afternoon</option>
    <option value="Busy weekend">Busy weekend</option>
    <option value="Rainy day">Rainy day</option>
    <option value="Just a normal day">Just a normal day</option>
</select>

<button onclick="generate()">Generate</button>

<div id="overlay" onclick="closeSheet()"></div>

<div id="sheet">
    <div class="drag-bar"></div>
    <div id="result"></div>
    <button class="copy-btn" onclick="copyText()">Copy</button>
</div>

<script>
const sheet = document.getElementById("sheet");
const overlay = document.getElementById("overlay");
let startY = 0;
let currentY = 0;
let isDragging = false;

async function generate() {
    const situation = document.getElementById("situation").value;

    const response = await fetch("/generate", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({ situation })
    });

    const data = await response.json();

    document.getElementById("result").innerText = data.text;

    overlay.classList.add("active");
    sheet.classList.add("active");
}

function closeSheet() {
    sheet.classList.remove("active");
    overlay.classList.remove("active");
}

function copyText() {
    const text = document.getElementById("result").innerText;
    navigator.clipboard.writeText(text);
}

/* Swipe Down */

sheet.addEventListener("touchstart", e => {
    startY = e.touches[0].clientY;
    isDragging = true;
});

sheet.addEventListener("touchmove", e => {
    if (!isDragging) return;
    currentY = e.touches[0].clientY;
    let diff = currentY - startY;
    if (diff > 0) {
        sheet.style.transform = `translateY(${diff}px)`;
    }
});

sheet.addEventListener("touchend", () => {
    isDragging = false;
    let diff = currentY - startY;

    if (diff > 100) {
        closeSheet();
    }

    sheet.style.transform = "translateY(0)";
});
</script>

</body>
</html>
