<!DOCTYPE html>
<html>
<head>
    <title>Cafe Caption</title>
    <meta charset="UTF-8" />
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 80px;
        }

        h1 {
            font-weight: 500;
        }

        select, button {
            padding: 10px;
            margin-top: 20px;
            font-size: 16px;
        }

        button {
            cursor: pointer;
        }

        #result {
            margin-top: 40px;
            max-width: 500px;
            white-space: pre-wrap;
        }

        .actions {
            margin-top: 10px;
        }
    </style>
</head>
<body>

<h1>Cafe Caption</h1>

<select id="situation">
    <option value="Morning opening">Morning opening</option>
    <option value="Slow afternoon">Slow afternoon</option>
    <option value="Busy weekend">Busy weekend</option>
    <option value="Rainy day">Rainy day</option>
    <option value="Just a normal day">Just a normal day</option>
</select>

<button onclick="generate()">Generate</button>

<div id="result"></div>

<div class="actions" id="actions" style="display:none;">
    <button onclick="copyText()">Copy</button>
    <button onclick="generate()">Regenerate</button>
</div>

<script>
async function generate() {
    const situation = document.getElementById("situation").value;

    const response = await fetch("/generate", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ situation })
    });

    const data = await response.json();
    document.getElementById("result").innerText = data.text;
    document.getElementById("actions").style.display = "block";
}

function copyText() {
    const text = document.getElementById("result").innerText;
    navigator.clipboard.writeText(text);
}
</script>

</body>
</html>
