<!DOCTYPE html>    
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cafe Caption</title>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@300;600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
   <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
   <style>
        :root { --bg: #F8F5F2; --accent: #A39184; --text: #4A443F; --border: #E8E2DC; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .app { width: 100%; max-width: 420px; }
        
        header { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 25px; }
        .logo-img { height: 42px; width: auto; display: block; }
        header h1 { margin: 0; font-family: 'Fraunces', serif; font-size: 1.8rem; font-weight: 300; }
        header span { color: var(--accent); font-weight: 600; }

        .card { background: white; padding: 24px; border-radius: 24px; border: 1px solid var(--border); box-shadow: 0 4px 20px rgba(0,0,0,0.02); margin-bottom: 20px; }
        label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 1.5px; color: #8C7B6F; display: block; margin-bottom: 10px; }
        
        .lang-bar { display: flex; gap: 15px; overflow-x: auto; padding-bottom: 12px; border-bottom: 1px solid #F1EFEF; margin-bottom: 20px; }
        .lang { font-size: 11px; opacity: 0.4; cursor: pointer; font-weight: 600; }
        .lang.active { opacity: 1; color: var(--accent); border-bottom: 2px solid var(--accent); }
        
        input { width: 100%; padding: 14px; border: 1px solid var(--border); border-radius: 12px; margin-bottom: 15px; font-family: inherit; font-size: 14px; box-sizing: border-box; outline: none; }
        
        .segments { display: flex; background: #F1EFEF; padding: 4px; border-radius: 12px; margin-bottom: 20px; }
        .seg { flex: 1; text-align: center; padding: 10px; font-size: 11px; cursor: pointer; border-radius: 10px; color: #8E8883; font-weight: 600; }
        .seg.active { background: white; color: var(--text); box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        
        button { width: 100%; padding: 18px; border-radius: 35px; border: none; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn-main { background: var(--accent); color: white; font-size: 17px; }
        .btn-premium { background: #4A443F; color: white; font-size: 15px; margin-top: 10px; border: 1px solid var(--accent); }
        .btn-sub { background: none; border: 1px solid var(--border); color: var(--accent); margin-top: 12px; font-size: 11px; text-transform: uppercase; }

        .sheet { position: fixed; bottom: -100%; left: 0; right: 0; background: #F2F0ED; padding: 35px 20px 60px 20px; border-radius: 30px 30px 0 0; transition: 0.5s; z-index: 1000; max-height: 80vh; overflow-y: auto; }
        .sheet.active { bottom: 0; }
        
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.25); display: none; z-index: 999; backdrop-filter: blur(8px); }

        .receipt { background: white; padding: 30px 25px; font-family: 'Courier New', monospace; margin-bottom: 20px; position: relative; white-space: pre-wrap; border-bottom: 2px dashed var(--border); }
        .photo-tip { margin-top: 15px; font-size: 12px; color: #777; border-top: 1px dashed #eee; padding-top: 10px; font-style: italic; font-family: 'Inter', sans-serif; }
        
        .actions { display: flex; gap: 10px; margin-top: 20px; }
        .action-btn { flex: 1; padding: 14px; border-radius: 14px; font-size: 12px; font-weight: 600; font-family: 'Inter', sans-serif; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; border: none; transition: 0.2s; }
        .action-btn:active { transform: scale(0.96); }
        .btn-copy { background: #F1EFEF; color: var(--text); }
        .btn-instagram { background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); color: white; text-decoration: none; }
    </style>
    
</head>
<body>

<div class="app">
    <header>
        <img src="logo.png" alt="Logo" class="logo-img">
        <h1>Cafe <span>Caption</span></h1>
    </header>
    
    <div id="user-info" style="display: none; margin-bottom: 15px; font-size: 12px; color: var(--accent);">
        <span id="display-email"></span> | <span id="user-credits"></span>
    </div>

    <div class="card">
        <div class="lang-bar">
            <div class="lang active" onclick="setL('English', this)">EN</div>
            <div class="lang" onclick="setL('German', this)">DE</div>
            <div class="lang" onclick="setL('French', this)">FR</div>
            <div class="lang" onclick="setL('Italian', this)">IT</div>
            <div class="lang" onclick="setL('Russian', this)">RU</div>
        </div>

        <label>Cafe Name</label>
        <input type="text" id="name" placeholder="Name of your space..." oninput="localStorage.setItem('name', this.value)">

        <label>Mood</label>
        <div class="segments">
            <div class="seg active" onclick="setV('mood','Poetic',this)">Poetic</div>
            <div class="seg" onclick="setV('mood','Minimal',this)">Minimal</div>
            <div class="seg" onclick="setV('mood','Witty',this)">Witty</div>
        </div>

       
        <label>Focus</label>
        <div class="segments">
            <div class="seg active" onclick="setV('goal','Atmosphere',this)">Atmosphere</div>
            <div class="seg" onclick="setV('goal','Drinks',this)">Drinks</div>
            <div class="seg" onclick="setV('goal','Food',this)">Food</div>
            <div class="seg" onclick="setV('goal','People',this)">People</div>
            <div class="seg" onclick="setV('goal','Daily',this)">Daily</div>
        </div>

        <button class="btn-main" id="go" onclick="brew()">Brew Content</button>
        <button class="btn-premium" id="go-week" onclick="brewWeek()">✨ Week Generator (7 Posts)</button>
    </div>
</div>

<div class="overlay" id="blur" onclick="toggleAll()"></div>

<div class="sheet" id="resultSheet">
    <div id="results-container"></div>
</div>

<div class="sheet" id="priceSheet">
    <h3 style="text-align:center; font-family: 'Fraunces', serif; margin-top: 0;">The Coffee Menu</h3>
    <p style="text-align:center; font-size: 13px; margin-bottom: 25px;">You're out of beans! Top up to keep brewing.</p>
    
    <button class="btn-main" onclick="buy('single')" style="margin-bottom:12px;">$5 — 50 Credits</button>
    <button class="btn-premium" onclick="buy('monthly')">$15/mo — Unlimited Access</button>
    
    <button class="btn-sub" onclick="togglePriceSheet(false)" style="width:100%; margin-top: 15px;">Maybe later</button>
</div>

<script>
const _supabase = supabase.createClient('https://fhfxpwgqnwnlafekmmrm.supabase.co', 'sb_publishable_0pLQ3vw_4N55UL-XCiytmA_Jl0HkYEh');

let state = { lang: 'English', mood: 'Poetic', goal: 'Atmosphere' };

async function brew() {
    const { data: { user } } = await _supabase.auth.getUser();
    
    if (!user) {
        localStorage.setItem('temp_name', document.getElementById('name').value);
        localStorage.setItem('auto_brew', 'true');
        return loginWithGoogle();
    }

    // ВАЖНО: Запрашиваем кредиты у НАШЕГО сервера, а не у Supabase напрямую
    try {
        const res = await fetch(`/get-credits?email=${user.email}`);
        const profile = await res.json();

        if (!profile.is_premium && profile.credits <= 0) {
            return togglePriceSheet(true);
        }
        executeGeneration(user.email);
    } catch (e) {
        console.error("Auth check failed", e);
    }
}
async function loginWithGoogle() {
    await _supabase.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: window.location.origin }
    });
}

async function executeGeneration(email) {
    const nameInput = document.getElementById('name');
    const btn = document.getElementById('go');
    btn.innerText = "Steeping...";
    btn.disabled = true;

    try {
        // Убедись, что fetch идет на правильный URL (относительный работает, если HTML отдает FastAPI)
        const res = await fetch('/generate', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                email: email,
                cafe_name: nameInput.value,
                language: state.lang,
                mood: state.mood,
                goal: state.goal,
                variants: 1 
            })
        });
        
        const data = await res.json();
        
        if (data.error === "credits_depleted") {
            return togglePriceSheet(true);
        } else if (data.error) {
            return alert(data.error);
        }

        renderResults(data.texts);
        // Обновляем цифру кредитов на экране
        document.getElementById('user-credits').innerText = data.remaining_credits + ' credits';
    } catch (e) {
        alert("Connection error to Python server");
    } finally {
        btn.innerText = "Brew Content";
        btn.disabled = false;
    }
}
function renderResults(texts) {
    let html = '';
    texts.forEach(text => {
        const parts = text.split('|');
        const caption = parts[0] ? parts[0].trim() : text;
        const photo = parts[1] ? parts[1].trim() : "Aesthetic cafe shot";
        html += `
            <div class="receipt">
                <div class="content-to-copy">${caption}</div>
                <div class="photo-tip">📸 <strong>PHOTO:</strong> ${photo}</div>
                <div class="actions">
                    <button class="action-btn btn-copy" onclick="copyText(this)">📋 COPY</button>
                    <button class="action-btn btn-instagram" onclick="window.open('https://instagram.com')">📸 IG</button>
                </div>
            </div>`;
    });
    document.getElementById('results-container').innerHTML = html;
    toggleSheet(true);
}

// Утилиты
function copyText(btn) {
    const text = btn.closest('.receipt').querySelector('.content-to-copy').innerText;
    navigator.clipboard.writeText(text);
    btn.innerText = "COPIED!";
    setTimeout(() => btn.innerText = "📋 COPY", 2000);
}

function toggleSheet(show) {
    document.getElementById('resultSheet').classList.toggle('active', show);
    document.getElementById('blur').style.display = show ? 'block' : 'none';
}

function togglePriceSheet(show) {
    document.getElementById('priceSheet').classList.toggle('active', show);
    document.getElementById('blur').style.display = show ? 'block' : 'none';
}

function toggleAll() {
    toggleSheet(false);
    togglePriceSheet(false);
}

function setL(l, el) {
    state.lang = l;
    document.querySelectorAll('.lang').forEach(x => x.classList.remove('active'));
    el.classList.add('active');
}

function setV(k, v, el) {
    state[k] = v;
    el.parentElement.querySelectorAll('.seg').forEach(x => x.classList.remove('active'));
    el.classList.add('active');
}

async function updateUI() {
    const { data: { user } } = await _supabase.auth.getUser();
    if (user) {
        const res = await fetch(`/get-credits?email=${user.email}`);
        const data = await res.json();
        
        document.getElementById('user-info').style.display = 'block';
        document.getElementById('display-email').innerText = user.email.split('@')[0];
        document.getElementById('user-credits').innerText = data.credits + ' credits';
    }
}

function buy(plan) {
    const links = {
        'single': 'https://buy.stripe.com/test_50credits',
        'monthly': 'https://buy.stripe.com/test_unlimited'
    };
    window.location.href = links[plan];
}

// Запуск при загрузке
window.onload = async () => {
    document.getElementById('name').value = localStorage.getItem('name') || '';
    
    const { data: { user } } = await _supabase.auth.getUser();
    if (user) {
        updateUI();
        if (localStorage.getItem('auto_brew') === 'true') {
            localStorage.removeItem('auto_brew');
            brew();
        }
    }
};

// Функция недели ДОЛЖНА быть тут (снаружи onload)
async function brewWeek() {
    const { data: { user } } = await _supabase.auth.getUser();
    if (!user) return loginWithGoogle();

    const nameInput = document.getElementById('name');
    const btn = document.getElementById('go-week');
    btn.innerText = "Roasting...";
    btn.disabled = true;

    try {
        const res = await fetch('/generate', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                email: user.email,
                cafe_name: nameInput.value,
                language: state.lang,
                mood: state.mood,
                goal: state.goal,
                variants: 7 
            })
        });
        const data = await res.json();
        if (data.error === "credits_depleted") return togglePriceSheet(true);
        renderResults(data.texts);
        document.getElementById('user-credits').innerText = data.remaining_credits + ' credits';
    } catch (e) {
        alert("Error brewing week");
    } finally {
        btn.innerText = "✨ Week Generator (7 Posts)";
        btn.disabled = false;
    }
}
</script>
</body>
</html>
