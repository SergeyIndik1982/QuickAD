<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafe Caption — AI Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #F8F5F2;
            --accent: #A39184;
            --text: #4A443F;
            --border: #E8E2DB;
            --white: #FFFFFF;
        }

        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .app-container {
            width: 100%;
            max-width: 400px;
        }

        /* --- ОБНОВЛЕННЫЙ ХЕДЕР --- */
        header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 25px;
        }

        .logo-img {
            height: 40px; /* Оптимальный размер */
            width: auto;
            display: block;
        }

        header h1 {
            font-family: 'Fraunces', serif;
            font-weight: 300;
            font-size: 1.6rem;
            margin: 0;
            line-height: 1;
        }

        header h1 span {
            color: var(--accent);
            font-weight: 600;
        }

        /* --- КАРТОЧКА --- */
        .card {
            background: var(--white);
            padding: 24px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(163, 145, 132, 0.1);
            border: 1px solid var(--border);
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
            opacity: 0.7;
        }

        .segments {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 20px;
        }

        .segment {
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: none;
            cursor: pointer;
            font-family: inherit;
            color: var(--text);
            transition: all 0.2s;
        }

        .segment.active {
            background: var(--accent);
            color: var(--white);
            border-color: var(--accent);
        }

        .btn-main {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 16px;
            background: var(--text);
            color: var(--white);
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .btn-main:active { transform: scale(0.98); }

        .btn-premium {
            width: 100%;
            margin-top: 10px;
            padding: 12px;
            background: none;
            border: 1px dashed var(--accent);
            color: var(--accent);
            border-radius: 16px;
            cursor: pointer;
            font-size: 14px;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            background: #FDFCFB;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.6;
            display: none; /* Скрыт до генерации */
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <img src="logo.png" alt="Logo" class="logo-img">
        <h1>Cafe <span>Caption</span></h1>
    </header>

    <div class="card">
        <label>Mood</label>
        <div class="segments" id="mood-group">
            <button class="segment active" onclick="select(this, 'mood')">Cozy</button>
            <button class="segment" onclick="select(this, 'mood')">Energetic</button>
        </div>

        <label>Goal</label>
        <div class="segments" id="goal-group">
            <button class="segment active" onclick="select(this, 'goal')">Menu Info</button>
            <button class="segment" onclick="select(this, 'goal')">Promo</button>
        </div>

        <button class="btn-main" onclick="brew()">Brew Content</button>
        <button class="btn-premium">✨ Week Plan (Premium)</button>

        <div id="result"></div>
    </div>
</div>

<script>
    let state = {
        mood: 'Cozy',
        goal: 'Menu Info'
    };

    function select(el, type) {
        const parent = el.parentElement;
        parent.querySelectorAll('.segment').forEach(b => b.classList.remove('active'));
        el.classList.add('active');
        state[type] = el.innerText;
    }

    async function brew() {
        const resDiv = document.getElementById('result');
        resDiv.style.display = 'block';
        resDiv.innerText = 'Brewing your content...';

        // Твоя логика запроса к API Railway/FastAPI
        // Здесь заглушка для примера:
        setTimeout(() => {
            resDiv.innerText = `[${state.mood}] Here is your perfect caption for ${state.goal}! Enjoy your coffee atmosphere.`;
        }, 1500);
    }
</script>

</body>
</html>
