<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QuickAD | Cafe Thoughts</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: rgba(255, 255, 255, 0.05);
            --accent: #38bdf8;
            --text: #f1f5f9;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .app-container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        header { text-align: center; margin-bottom: 10px; }
        header h1 { font-weight: 600; font-size: 2rem; margin: 0; color: var(--accent); }
        header p { opacity: 0.6; font-size: 0.9rem; }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }

        label { font-size: 0.8rem; font-weight: 600; opacity: 0.7; margin-left: 5px; }

        select {
            background: #1e293b;
            border: 1px solid #334155;
            color: white;
            padding: 12px;
            border-radius: 12px;
            font-size: 16px; /* Важно для мобилок */
            outline: none;
            appearance: none;
        }

        button {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            margin-top: 10px;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
        }

        button:active { transform: scale(0.98); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        #results {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .thought-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 18px;
            border-left: 4px solid var(--accent);
            animation: slideUp 0.4s ease-out;
            line-height: 1.5;
            font-weight: 300;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Индикатор загрузки */
        .loader {
            display: none;
            text-align: center;
            margin: 20px 0;
            font-style: italic;
            opacity: 0.8;
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>QuickAD</h1>
        <p>Digital Cafe Observer</p>
    </header>

    <div class="controls">
        <label>WHO ARE YOU?</label>
        <select id="speaker">
            <option value="Tired Barista">Tired Barista</option>
            <option value="Snooty Regular">Snooty Regular</option>
            <option value="Coffee Machine">Coffee Machine (AI)</option>
            <option value="First-time Visitor">First-time Visitor</option>
        </select>

        <label>CURRENT MOOD</label>
        <select id="mood">
            <option value="Sarcastic">Sarcastic</option>
            <option value="Poetic">Poetic</option>
            <option value="Grumpy">Grumpy</option>
            <option value="Existential">Existential</option>
        </select>

        <label>THE SCENE</label>
        <select id="occasion">
            <option value="Morning rush">Morning Rush</option>
            <option value="Rainy afternoon">Rainy Afternoon</option>
            <option value="Late night study">Late Night Study</option>
            <option value="Empty cafe">Empty Cafe</option>
        </select>

        <button id="writeBtn" onclick="generate()">Brew Thoughts</button>
    </div>

    <div id="loader" class="loader">Grinding coffee beans...</div>
    <div id="results"></div>
</div>

<script>
    async function generate() {
        const btn = document.getElementById('writeBtn');
        const loader = document.getElementById('loader');
        const results = document.getElementById('results');
        
        const payload = {
            speaker: document.getElementById('speaker').value,
            mood: document.getElementById('mood').value,
            occasion: document.getElementById('occasion').value,
            variants: 3
        };

        // UI State: Loading
        btn.disabled = true;
        loader.style.display = 'block';
        results.innerHTML = '';

        try {
            const response = await fetch('/generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            
            const data = await response.json();
            
            data.texts.forEach(text => {
                const card = document.createElement('div');
                card.className = 'thought-card';
                card.innerText = text;
                results.appendChild(card);
            });
        } catch (error) {
            results.innerHTML = `<div class="thought-card" style="border-color: #ff4444;">Ошибка связи с баристой...</div>`;
        } finally {
            btn.disabled = false;
            loader.style.display = 'none';
        }
    }
</script>

</body>
</html>
